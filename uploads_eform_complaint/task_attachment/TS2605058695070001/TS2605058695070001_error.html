<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Error Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
      font-family: Arial, sans-serif;
    }

    .popup {
      background: #fff;
      width: 380px;
      padding: 30px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.15);
      animation: fadeIn 0.4s ease-out;
      border-top: 6px solid #dc3545;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .icon {
      font-size: 70px;
      color: #dc3545;
      margin-bottom: 10px;
      animation: shake 0.4s ease-out;
    }

    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      50% { transform: translateX(6px); }
      75% { transform: translateX(-4px); }
      100% { transform: translateX(0); }
    }

    h2 {
      margin: 0;
      font-size: 26px;
      margin-bottom: 8px;
      color: #b02a37;
    }

    p {
      color: #555;
      margin-bottom: 20px;
    }

    button {
      background: #dc3545;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #bb2d3b;
    }
  </style>
</head>
<body>

  <div class="popup">
    <div class="icon">✕</div>
    <h2>Feedback Error!</h2>
    <p>Your Feedback already been submited.</p>
    <button onclick="'">OK</button>
  </div>

</body>
</html>
